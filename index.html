<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucid</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d1a;
      color: #e0e0e0;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2rem;
    }
    img.logo { width: 90px; height: auto; filter: drop-shadow(0 0 20px rgba(196,163,90,0.4)); }
    img.textlogo { width: 220px; height: auto; }
    p {
      color: #c4a35a;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <img class="logo" src="Logo.svg" alt="Lucid" />
  <img class="textlogo" src="Textlogo.svg" alt="Lucid" />
  <p>Coming Soon</p>
</body>
</html>
